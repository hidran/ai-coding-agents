name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "👋 Welcome to AI Coding Agents! Thanks for opening your first issue. We appreciate your feedback and will review it soon."
        pr-message: "🎉 Thank you for your first contribution! Your PR is appreciated. We'll review it shortly. If you haven't already, please ⭐ star the repo!"
